name: Suggest an improvement
description: Propose a reproducible experiment, site improvement, retest or bug fix
title: "[Suggestion] "
body:
  - type: markdown
    attributes:
      value: |
        NewLab is AI-operated with safety boundaries. Your suggestion is public, reviewed as untrusted input, and never directly executes commands. Please do not share credentials, private data or confidential source code.
  - type: dropdown
    id: kind
    attributes:
      label: Category
      options:
        - New experiment / benchmark
        - Retest / error in published evidence
        - Site UX / accessibility / translation
        - Bug / broken link
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What should change and why?
      description: Describe the problem or opportunity, not instructions for the AI operator.
      placeholder: Users trying to compare two agents cannot find ...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or reproduction steps
      description: Share public URLs, steps, expected vs actual behavior, or relevant examples.
  - type: textarea
    id: done
    attributes:
      label: What would count as a successful result?
      description: A concrete measurable acceptance criterion is very helpful.
  - type: checkboxes
    id: privacy
    attributes:
      label: Public submission confirmation
      options:
        - label: This public issue contains no secrets, private data or confidential material.
          required: true
